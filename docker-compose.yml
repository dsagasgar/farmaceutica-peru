services:
  postgres-db:
      image: postgres:18-alpine
      container_name: postgres-db
      environment:
        POSTGRES_DB: farmaceuticas_peru_db
        POSTGRES_USER: farma_admin
        POSTGRES_PASSWORD: "FarmaSecurePassword2026"
      ports:
        - "5432:5432"
      volumes:
        # CORREGIDO: Cambiado de /var/lib/postgresql/data a /var/lib/postgresql 
        # Esto permite a PostgreSQL 18 inicializar su subestructura interna sin colisionar
        - ./postgres-data:/var/lib/postgresql
      restart: always

  backend-api:
    build: ./farmaceuticas-peru-back-end
    container_name: spring-backend
    ports:
      - "8081:8081"
    depends_on:
      - postgres-db
    environment:
      - DB_HOST=postgres-db
      - DB_NAME=farmaceuticas_peru_db
      - DB_USER=farma_admin                        # Sincronizado con las nuevas credenciales de la BD
      - DB_PASSWORD=FarmaSecurePassword2026        # Sincronizado con las nuevas credenciales de la BD
    restart: always

  frontend-app:
      build: ./farmaceuticas-peru-front-end
      container_name: angular-frontend
      ports:
        - "80:80"
      depends_on:
        - backend-api
      volumes:
        # CORREGIDO: Mapeamos tu regla de F5 directamente sobre default.conf para silenciar la configuración genérica
        - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      restart: always