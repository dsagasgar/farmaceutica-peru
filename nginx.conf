server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Si la ruta no es un archivo físico ($uri) ni una carpeta ($uri/), 
        # Nginx sirve el index.html de forma transparente sin cambiar la URL.
        try_files $uri $uri/ /index.html;
    }

    # Cache control para assets estáticos (opcional, optimiza el rendimiento)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}